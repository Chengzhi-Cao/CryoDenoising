#### general settings
name: SemanticAware_10017
use_tb_logger: true
model: semantic_sr
distortion: sr
scale: 1
save_img: true
gpu_ids: [0]

#### network structures
network_G:
  which_model_G: SemanticAwareDenoiser
  in_nc: 3
  mask_nc: 1
  out_nc: 3
  nf: 48
  num_blocks: 3
  num_sf_blocks: 2
  patch_grid: 8
  scale: 1

#### datasets
datasets:
  train:
    name: cryo_train
    mode: LQGT_semantic
    # Noise2Noise setting: LQ can be odd-frame micrographs and GT can be
    # independently summed even-frame micrographs.
    dataroot_GT: datasets/train/even
    dataroot_LQ: datasets/train/odd
    # Optional semantic masks from CryoSegNet/SAM. Set to ~ to train without masks.
    dataroot_mask: datasets/train/masks
    use_shuffle: true
    n_workers: 4
    batch_size: 8
    GT_size: 128
    use_flip: true
    use_rot: true
    color: RGB
    mask_threshold: 0.5
    scale: 1
  val:
    name: cryo_val_10017
    mode: LQGT_semantic
    dataroot_GT: datasets/10017/even
    dataroot_LQ: datasets/10017/odd
    dataroot_mask: datasets/10017/masks
    color: RGB
    mask_threshold: 0.5
    scale: 1

#### path
path:
  pretrain_model_G: ~
  strict_load: true
  resume_state: ~

#### training settings: learning rate scheme, loss
train:
  lr_G: !!float 1e-3
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.99
  weight_decay_G: 0
  niter: 60000
  warmup_iter: -1
  lr_steps: [30000, 50000]
  lr_gamma: 0.1
  restarts: []
  restart_weights: []
  clear_state: false

  pixel_criterion: mse
  pixel_weight: 1.0

  manual_seed: 10
  val_freq: 2000

#### logger
logger:
  print_freq: 100
  save_checkpoint_freq: 2000
